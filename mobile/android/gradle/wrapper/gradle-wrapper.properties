# Gradle 8.14 plutôt que 9.1 : la distribution 9.1 n'a jamais pu être
# téléchargée entièrement ici (connexion coupée à 52 Mo sur 230), tandis
# que la 8.14 est déjà en cache et compatible avec le plugin Android en
# usage. Rien dans le projet n'exige Gradle 9.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip
