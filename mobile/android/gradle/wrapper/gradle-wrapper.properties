# Distribution `-bin` et non `-all` : le plugin Android impose Gradle 9.1,
# mais `-all` embarque les sources et la documentation — 230 Mo contre 130,
# pour rien. Sur une connexion instable, cette différence décide si la
# compilation aboutit ou non.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.1.0-bin.zip
