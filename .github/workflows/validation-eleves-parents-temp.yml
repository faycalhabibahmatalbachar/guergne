name: Vérification ponctuelle - listes Élèves et Parents
on:
  push:
    branches:
      - feat/eleves-edit-parent-links-parents-ui
    paths:
      - .github/workflows/validation-eleves-parents-temp.yml
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
