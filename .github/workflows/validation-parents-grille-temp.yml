name: Validation provisoire - grille Parents 5 cartes
on:
  push:
    branches: [fix/parents-kpis-single-row]
    paths: [.github/workflows/validation-parents-grille-temp.yml]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
