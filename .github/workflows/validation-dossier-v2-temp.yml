name: Vérification ponctuelle du dossier élève V2
on:
  push:
    branches:
      - fix/dossier-eleve-hierarchy-layout-v2
    paths:
      - .github/workflows/validation-dossier-v2-temp.yml
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

# Dernière validation du gabarit et du contrôle des actions.
