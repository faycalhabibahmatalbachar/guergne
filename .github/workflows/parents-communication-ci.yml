name: Parents Communication — TypeScript and Tests
on:
  push:
    branches:
      - feat/parents-communication-suite
  pull_request:
    paths:
      - 'web/src/app/(main)/dashboard/parents/**'
      - 'web/src/server/domain/suivi-notifications-parents.ts'
      - '.github/workflows/parents-communication-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck (no production credentials)
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
