name: Validation Parents P1 temporaire
on:
  push:
    branches: [fix/parents-fiabilisation-p1]
    paths: [.github/workflows/validation-parents-fiabilisation-temp.yml]
permissions:
  contents: read
jobs:
  valider:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
