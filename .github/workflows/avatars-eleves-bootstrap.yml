name: Génération ponctuelle des avatars Élèves

on:
  push:
    branches:
      - feat/eleves-avatars-illustres
    paths:
      - ".github/workflows/avatars-eleves-bootstrap.yml"

permissions:
  contents: write

jobs:
  preparer-avatars:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Télécharger et vérifier les 40 illustrations CC0
        run: python3 web/scripts/generer-avatars-eleves.py
      - name: Installer les dépendances existantes
        working-directory: web
        run: npm ci
      - name: Vérifier les tests (dont attribution des avatars)
        working-directory: web
        run: npm test
      - name: Vérifier TypeScript
        working-directory: web
        run: npx tsc --noEmit
      - name: Enregistrer les SVG sur la branche de travail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/avatars/eleves/*.svg
          git diff --cached --exit-code && exit 1 || true
          git commit -m "assets(eleves): ajouter 40 illustrations Open Peeps CC0 locales"
          git push origin HEAD:feat/eleves-avatars-illustres

# Tentative 2 : journaliser la réponse de l'API SVG.

# Tentative 3 : variante de coiffure unique (API impose max 64 caractères).

# Tentative 4 : chaque composant du SVG reçoit une seule variante valide.

# Tentative 5 : import de test compatible avec Node TS.
