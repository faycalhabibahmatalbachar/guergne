name: Web validation

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
