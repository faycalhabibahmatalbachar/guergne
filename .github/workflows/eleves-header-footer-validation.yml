name: Validation ponctuelle Header Footer Élèves
on:
  push:
    branches:
      - feat/eleves-header-footer-ux
    paths:
      - .github/workflows/eleves-header-footer-validation.yml
permissions:
  contents: read
jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Exécuter les tests
        run: npm test
      - name: Vérifier les types
        run: npx tsc --noEmit
