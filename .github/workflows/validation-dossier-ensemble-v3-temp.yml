name: Validation ponctuelle Vue d'ensemble dossier V3

on:
  push:
    branches:
      - feat/dossier-ensemble-redesign-v3
    paths:
      - .github/workflows/validation-dossier-ensemble-v3-temp.yml

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
