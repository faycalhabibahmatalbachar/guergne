name: Validation temporaire — actions Élèves
on:
  push:
    branches:
      - fix/eleves-deplacement-actions-lot
    paths:
      - .github/workflows/validation-deplacement-eleves.yml
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      # Le build dépend de DATABASE_URL : Vercel vérifie ce point avec Neon configuré.

# Deuxième passage : correction de la portée SQL des notifications.

# Revalidation : test de non-régression UUID scalaire pour la sélection.
